<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITEC Smart Learning</title>
    <!-- เชื่อมต่อระบบ PWA App -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BITEC App">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e31e24; --blue: #005eb8; --bg: #fcfcfc; --card: #ffffff; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; color: #333; -webkit-tap-highlight-color: transparent; }
        
        header { background: var(--red); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.5rem; }
        .subtitle { margin: 5px 0 0; font-weight: 300; font-size: 0.9rem; }

        .container { max-width: 1100px; margin: 20px auto; width: 95%; padding-bottom: 50px; }
        
        /* Navigation */
        .floor-selector { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; position: sticky; top: 10px; z-index: 100; }
        .floor-btn { padding: 10px 20px; border-radius: 12px; border: 2px solid #ddd; background: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .floor-btn.active { border-color: var(--red); background: var(--red); color: white; }

        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; display: none; }
        .card.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Hall Grid */
        .hall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin: 15px 0; }
        .hall-tag { background: #f8f9fa; padding: 10px 5px; border-radius: 8px; text-align: center; font-size: 0.8rem; border: 1px solid #eee; cursor: pointer; font-weight: 600; }
        .hall-tag:hover { border-color: var(--blue); background: #f0f7ff; }

        /* Info Display */
        .info-box { background: #fff; border: 2px solid #f0f0f0; border-radius: 15px; padding: 15px; margin-top: 15px; display: none; }
        .data-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .data-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; padding: 5px; background: #fafafa; border-radius: 8px; }
        .icon { font-size: 1.1rem; width: 25px; text-align: center; }

        /* Quiz */
        .quiz-nav { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }
        .quiz-btn { border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; color: white; transition: 0.2s; }
        .quiz-btn.beginner { background: #444; }
        .quiz-btn.intermediate { background: #6c5ce7; }
        .option-btn { width: 100%; text-align: left; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; background: white; cursor: pointer; font-family: 'Kanit'; }
        
        .floor-img { width: 100%; border-radius: 10px; margin-bottom: 15px; border: 1px solid #eee; }
    </style>
</head>
<body>

<header>
    <h1>BITEC Adventure</h1>
    <p class="subtitle">มาเรียนรู้พื้นที่ไบเทคกันเถอะ!</p>
</header>

<div class="container">
    <div class="floor-selector">
        <button class="floor-btn active" id="btn-f1" onclick="switchFloor(1)">BITEC 1st Floor</button>
        <button class="floor-btn" id="btn-f2" onclick="switchFloor(2)">BITEC 2nd Floor</button>
    </div>

    <!-- 1st Floor View -->
    <div id="view-f1" class="card active">
        <h2 style="color:var(--red)">BITEC 1st Floor</h2>
        <img src="BITEC 1st Floor.png" alt="BITEC Floor Plan 1" class="floor-img">
        <p style="font-size:0.9rem; color:#666;">คลิกเลือกห้องเพื่อดูข้อมูล กว้างxยาว และความสูง</p>
        <div class="hall-grid" id="grid-f1"></div>
        <div id="details-f1" class="info-box"></div>
        
        <div class="quiz-nav">
            <button class="quiz-btn beginner" onclick="startQuiz(1, 'beginner')">🎯 Quiz: Beginner (ข้อมูลพื้นที่)</button>
            <button class="quiz-btn intermediate" onclick="startQuiz(1, 'intermediate')">🏆 Quiz: Intermediate (ความจุ)</button>
        </div>
    </div>

    <!-- 2nd Floor View -->
    <div id="view-f2" class="card">
        <h2 style="color:var(--blue)">BITEC 2nd Floor</h2>
        <img src="BITEC 2nd floor.png" alt="BITEC Floor Plan 2" class="floor-img">
        <p style="font-size:0.9rem; color:#666;">ข้อมูล Bhiraj, Grand Hall และ Meeting Rooms</p>
        <div class="hall-grid" id="grid-f2"></div>
        <div id="details-f2" class="info-box"></div>
        
        <div class="quiz-nav">
            <button class="quiz-btn beginner" onclick="startQuiz(2, 'beginner')">🎯 Quiz: Beginner (ข้อมูลพื้นที่)</button>
            <button class="quiz-btn intermediate" onclick="startQuiz(2, 'intermediate')">🏆 Quiz: Intermediate (ความจุ)</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="card">
        <h2 id="quiz-head" style="color:#6c5ce7">แบบทดสอบ</h2>
        <div id="quiz-content">
            <p id="q-text" style="font-size:1.1rem; font-weight:600; min-height: 50px;"></p>
            <div id="options-box"></div>
            <div id="feedback" style="margin-top:15px; font-weight:bold; height: 30px;"></div>
        </div>
        <div id="result-area" style="display:none; text-align:center;">
            <h3 id="final-score" style="font-size:2rem; color:var(--blue);"></h3>
            <button class="floor-btn" onclick="location.reload()">🔙 กลับหน้าหลัก</button>
        </div>
    </div>
</div>

<script>
    // ข้อมูลอ้างอิงจาก Dimensions & Capacities 2025
    const bitecData = {
        'EH 98': { f: 1, dim: '88x98', h: '15', t: '9,000', c: '5,500', cock: '6,700', b_s: '3,500', booth: '500' },
        'EH 99': { f: 1, dim: '88x63', h: '15', t: '5,700', c: '3,200', cock: '4,300', b_s: '2,100', booth: '330' },
        'EH 100': { f: 1, dim: '106x63', h: '25', t: '7,200', c: '4,000', cock: '5,200', b_s: '2,600', booth: '400' },
        'EH 101': { f: 1, dim: '97x56', h: '15', t: '5,700', c: '3,600', cock: '4,200', b_s: '2,000', booth: '300' },
        'EH 102': { f: 1, dim: '97x54', h: '15', t: '5,700', c: '3,300', cock: '4,000', b_s: '1,800', booth: '300' },
        'EH 103': { f: 1, dim: '97x54', h: '15', t: '5,700', c: '3,300', cock: '4,000', b_s: '1,800', booth: '300' },
        'EH 104': { f: 1, dim: '97x45', h: '15', t: '4,300', c: '2,700', cock: '3,400', b_s: '1,500', booth: '250' },
        'GH 201-203': { f: 2, dim: '31x58', h: '9', t: '2,000', c: '1,100', cock: '1,300', b_ns: '1,000', b_s: '900', booth: '100' },
        'GH 201': { f: 2, dim: '31x17', h: '9', t: '520', c: '300', cock: '400', b_ns: '320', b_s: '240', booth: '30' },
        'GH 202': { f: 2, dim: '31x18', h: '9', t: '520', c: '300', cock: '400', b_ns: '320', b_s: '240', booth: '30' },
        'GH 203': { f: 2, dim: '31x23', h: '9', t: '720', c: '400', cock: '500', b_ns: '480', b_s: '360', booth: '30' },
        'BH 1-3': { f: 2, dim: '44x80', h: '12', t: '3,600', c: '2,200', cock: '2,100', b_ns: '2,000', b_s: '1,700', booth: '170' },
        'BH 1': { f: 2, dim: '44x26', h: '12', t: '1,200', c: '720', cock: '900', b_ns: '660', b_s: '480', booth: '50' },
        'BH 2': { f: 2, dim: '44x27', h: '12', t: '1,200', c: '720', cock: '900', b_ns: '660', b_s: '480', booth: '60' },
        'BH 3': { f: 2, dim: '44x26', h: '12', t: '1,200', c: '720', cock: '900', b_ns: '660', b_s: '480', booth: '50' },
        'MR 211': { f: 2, dim: '12x9', h: '4', t: '80', c: '60', cock: '80', u: '25', b_ns: '60', b_s: '50' },
        'SILK 1': { f: 2, dim: '10x16', h: '6', t: '170', c: '80', cock: '130', u: '40', b_ns: '120', b_s: '90' }
    };

    function switchFloor(f) {
        document.getElementById('view-f1').classList.toggle('active', f===1);
        document.getElementById('view-f2').classList.toggle('active', f===2);
        document.getElementById('btn-f1').classList.toggle('active', f===1);
        document.getElementById('btn-f2').classList.toggle('active', f===2);
        document.getElementById('quiz-screen').classList.remove('active');
        window.scrollTo(0,0);
    }

    function init() {
        Object.keys(bitecData).forEach(key => {
            const f = bitecData[key].f;
            const btn = document.createElement('div');
            btn.className = 'hall-tag';
            btn.innerText = key;
            btn.onclick = () => {
                const d = bitecData[key];
                const box = document.getElementById(`details-f${f}`);
                box.style.display = 'block';
                box.innerHTML = `
                    <h3 style="margin:0 0 10px; color:var(--red);">📍 ${key}</h3>
                    <div class="data-row">
                        <div class="data-item"><span class="icon">📏</span> ขนาด: ${d.dim} ม.</div>
                        <div class="data-item"><span class="icon">↕️</span> ความสูง: ${d.h} ม.</div>
                        <div class="data-item"><span class="icon">🪑</span> Theatre (เก้าอี้ล้วน): ${d.t}</div>
                        <div class="data-item"><span class="icon">📚</span> Classroom (โต๊ะพร้อมเก้าอี้): ${d.c}</div>
                        <div class="data-item"><span class="icon">🥂</span> Cocktail: ${d.cock}</div>
                        ${d.u ? `<div class="data-item"><span class="icon">🧲</span> U-Shape (จัดแบบตัว U): ${d.u}</div>` : ''}
                        ${d.b_ns ? `<div class="data-item"><span class="icon">🍽️</span> Banquet without stage (โต๊ะกลมไม่มีเวที): ${d.b_ns}</div>` : ''}
                        ${d.b_s ? `<div class="data-item"><span class="icon">🍱</span> Banquet with stage (โต๊ะกลมพร้อมเวที): ${d.b_s}</div>` : ''}
                        ${d.booth ? `<div class="data-item"><span class="icon">🎪</span> Booth 3x3 (คูหานิทรรศการ 3x3): ${d.booth}</div>` : ''}
                    </div>
                `;
                box.scrollIntoView({behavior: "smooth", block: "center"});
            };
            document.getElementById(`grid-f${f}`).appendChild(btn);
        });
    }

    let qList = [], curQ = 0, score = 0;

    function startQuiz(floor, level) {
        const halls = Object.keys(bitecData).filter(k => bitecData[k].f === floor);
        qList = [];
        halls.forEach(h => {
            const d = bitecData[h];
            if(level === 'beginner') {
                qList.push({ q: `ห้อง ${h} มีความสูง (Height) เท่าไหร่?`, a: [`${d.h} เมตร`, '5 เมตร', '30 เมตร'], c: 0 });
                qList.push({ q: `ห้อง ${h} มีขนาด กว้าง x ยาว เท่าไหร่?`, a: [`${d.dim} เมตร`, '100x100 เมตร', '50x50 เมตร'], c: 0 });
            } else {
                qList.push({ q: `ห้อง ${h} รองรับการจัดแบบ Theatre (เก้าอี้ล้วน) ได้กี่คน?`, a: [`${d.t} คน`, '1,000 คน', '5,000 คน'], c: 0 });
                if(d.booth) qList.push({ q: `ห้อง ${h} วางคูหานิทรรศการ 3x3 ได้กี่บูธ?`, a: [`${d.booth} บูธ`, '10 บูธ', '80 บูธ'], c: 0 });
            }
        });
        qList = qList.sort(() => 0.5 - Math.random()).slice(0, 10);
        curQ = 0; score = 0;
        document.getElementById('view-f1').classList.remove('active');
        document.getElementById('view-f2').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        document.getElementById('quiz-content').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';
        loadQ();
    }

    function loadQ() {
        if(curQ >= qList.length) {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('final-score').innerText = `คะแนนของคุณ: ${score} / ${qList.length}`;
            return;
        }
        const q = qList[curQ];
        document.getElementById('q-text').innerText = `ข้อที่ ${curQ+1}: ${q.q}`;
        const box = document.getElementById('options-box');
        box.innerHTML = "";
        document.getElementById('feedback').innerText = "";

        const opts = [...q.a].map((t, i) => ({t, ok: i===q.c})).sort(() => 0.5 - Math.random());
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = o.t;
            b.onclick = () => {
                if(o.ok) { score++; document.getElementById('feedback').innerText = "✅ ถูกต้อง!"; }
                else { document.getElementById('feedback').innerText = "❌ ผิดครับ ข้อมูลจริงคือ " + q.a[0]; }
                curQ++;
                setTimeout(loadQ, 1200);
            };
            box.appendChild(b);
        });
    }

    init();
    
    // Service Worker for PWA[cite: 1]
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('https://cdn.jsdelivr.net/npm/workbox-cdn@5.1.3/workbox-sw.js');
      });
    }
</script>
</body>
</html>
