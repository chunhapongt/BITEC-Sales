    <style>
        :root { --red: #e31e24; --blue: #005eb8; --bg: #fcfcfc; --card: #ffffff; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; color: #333; -webkit-tap-highlight-color: transparent; }
        header { background: var(--red); color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.6rem; }
        .subtitle { margin: 5px 0 0; font-weight: 300; font-size: 0.9rem; opacity: 0.9; }
        .container { max-width: 1100px; margin: 20px auto; width: 95%; padding-bottom: 50px; }
        .floor-selector { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; position: sticky; top: 10px; z-index: 100; }
        .floor-btn { padding: 12px 25px; border-radius: 12px; border: 2px solid #ddd; background: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .floor-btn.active { border-color: var(--red); background: var(--red); color: white; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; display: none; }
        .card.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .hall-tag { background: #f8f9fa; padding: 12px 5px; border-radius: 10px; text-align: center; font-size: 0.85rem; border: 1px solid #eee; cursor: pointer; font-weight: 600; }
        .hall-tag:hover { border-color: var(--blue); background: #f0f7ff; }
        .info-box { background: #fff; border: 2px solid #f0f0f0; border-radius: 15px; padding: 20px; margin-top: 15px; display: none; }
        .data-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .data-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; padding: 8px 12px; background: #fafafa; border-radius: 10px; border: 1px solid #f0f0f0; }
        .icon { font-size: 1.3rem; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; }
        .quiz-nav { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
        .quiz-btn { border: none; padding: 18px; border-radius: 15px; cursor: pointer; font-size: 1.05rem; font-weight: 600; color: white; transition: 0.2s; }
        .quiz-btn.beginner { background: #444; }
        .quiz-btn.intermediate { background: #6c5ce7; }
        .option-btn { width: 100%; text-align: left; padding: 18px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; background: white; cursor: pointer; font-family: 'Kanit'; font-size: 1rem; }
        .floor-img { width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid #eee; max-height: 500px; object-fit: contain; background: #eee; }

    function switchFloor(f) {
        document.getElementById('view-f1').classList.toggle('active', f===1);
        document.getElementById('view-f2').classList.toggle('active', f===2);
        document.getElementById('btn-f1').classList.toggle('active', f===1);
        document.getElementById('btn-f2').classList.toggle('active', f===2);
        document.getElementById(`img-f${f}`).src = f===1 ? 'BITEC 1st Floor.png' : 'BITEC 2nd Floor.png';
        document.getElementById('quiz-screen').classList.remove('active');
        window.scrollTo(0,0);
    }

    function init() {
        Object.keys(bitecData).forEach(key => {
            const f = bitecData[key].f;
            const btn = document.createElement('div');
            btn.className = 'hall-tag';
            btn.innerText = key;
            btn.onclick = () => {
                const d = bitecData[key];
                const box = document.getElementById(`details-f${f}`);
                const img = document.getElementById(`img-f${f}`);
                img.src = `${key}.png`; 
                img.onerror = () => { img.src = f===1 ? 'BITEC 1st Floor.png' : 'BITEC 2nd Floor.png'; };
                box.style.display = 'block';
                box.innerHTML = `
                    <h3 style="margin:0 0 12px; color:var(--red);">📍 ${key}</h3>
                    <div class="data-row">

                        <div class="data-item"><span class="icon">📚</span> Classroom (โต๊ะพร้อมเก้าอี้): ${d.c}</div>
                        <div class="data-item"><span class="icon">🥂</span> Cocktail: ${d.cock}</div>

                        ${d.b_ns ? `<div class="data-item"><span class="icon">🍽️</span> Banquet without stage: ${d.b_ns}</div>` : ''}
                        ${d.b_s ? `<div class="data-item"><span class="icon">🍱</span> Banquet with stage: ${d.b_s}</div>` : ''}
                        ${d.booth ? `<div class="data-item"><span class="icon">🎪</span> Booth 3x3: ${d.booth}</div>` : ''}
                    </div>
                `;
                box.scrollIntoView({behavior: "smooth", block: "center"});
            };
            document.getElementById(`grid-f${f}`).appendChild(btn);
        });
    }

    // ระบบสุ่มตัวเลขแบบ Make Sense
    function generateSmartOthers(correctValue, type) {
        let others = new Set();
        let num = parseFloat(correctValue.replace(/,/g, ''));
        
        while(others.size < 2) {
            let newVal;
            if (type === 'capacity') {
                // ตัวหลอกจำนวนคน ให้ห่างจากค่าจริง 10-25% และปัดเลขกลมๆ
                let diff = Math.max(50, Math.round(num * (0.15 + Math.random() * 0.1) / 50) * 50);
                newVal = Math.random() > 0.5 ? num + diff : num - diff;
                if(newVal > 0 && newVal !== num) others.add(newVal.toLocaleString() + " คน");
            } else if (type === 'booth') {
                // ตัวหลอกบูธ ให้เป็นเลขลงท้าย 0 หรือ 5 เสมอ
                let diff = [20, 30, 50, 100][Math.floor(Math.random() * 4)];
                newVal = Math.random() > 0.5 ? num + diff : num - diff;
                if(newVal > 0 && newVal !== num) others.add(newVal + " บูธ");
            } else {
                // สำหรับความสูง
                let diff = (Math.random() * 3 + 1).toFixed(1);
                newVal = (Math.random() > 0.5 ? num + parseFloat(diff) : num - parseFloat(diff)).toFixed(1);
                if(newVal > 0 && newVal != num) others.add(newVal + " ม.");
            }
        }
        return Array.from(others);
    }

    let qList = [], curQ = 0, score = 0;
    function startQuiz(floor, level) {
        const halls = Object.keys(bitecData).filter(k => bitecData[k].f === floor);
        qList = [];
        halls.forEach(h => {
            const d = bitecData[h];
            if(level === 'beginner') {
                qList.push({ q: `ห้อง ${h} มีความสูงเท่าไหร่?`, correct: `${d.h} ม.`, others: generateSmartOthers(d.h, 'height') });
                qList.push({ q: `ห้อง ${h} มีขนาด กว้าง x ยาว เท่าไหร่?`, correct: `${d.dim} ม.`, others: ["95x47 ม.", "85x63 ม."] });
            } else {
                qList.push({ q: `ห้อง ${h} รองรับ Theatre ได้กี่คน?`, correct: `${d.t} คน`, others: generateSmartOthers(d.t, 'capacity') });
                if(d.booth) qList.push({ q: `ห้อง ${h} วางบูธ 3x3 ได้กี่บูธ?`, correct: `${d.booth} บูธ`, others: generateSmartOthers(d.booth, 'booth') });
            }
        });
        qList = qList.sort(() => 0.5 - Math.random()).slice(0, 10);
        curQ = 0; score = 0;
        document.getElementById('view-f1').classList.remove('active'); document.getElementById('view-f2').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active'); loadQ();
    }

    function loadQ() {
        if(curQ >= qList.length) {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('final-score').innerText = `คะแนนของคุณ: ${score} / 10`;
            return;
        }
        const q = qList[curQ]; document.getElementById('q-text').innerText = `ข้อที่ ${curQ+1}: ${q.q}`;
        const box = document.getElementById('options-box'); box.innerHTML = ""; document.getElementById('feedback').innerText = "";
        let opts = [q.correct, ...q.others].sort(() => 0.5 - Math.random());
        opts.forEach(opt => {
            const b = document.createElement('button'); b.className = "option-btn"; b.innerText = opt;
            b.onclick = () => {
                if(opt === q.correct) { score++; document.getElementById('feedback').innerText = "✅ ถูกต้อง!"; document.getElementById('feedback').style.color = "green"; }
                else { document.getElementById('feedback').innerText = "❌ ผิด! คำตอบคือ " + q.correct; document.getElementById('feedback').style.color = "red"; }
                curQ++; setTimeout(loadQ, 1500);
            };
            box.appendChild(b);
        });
    }
