        .quiz-nav { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
        .quiz-btn { border: none; padding: 18px; border-radius: 15px; cursor: pointer; font-size: 1.05rem; font-weight: 600; color: white; transition: 0.2s; }

        .option-btn { width: 100%; text-align: left; padding: 18px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; background: white; cursor: pointer; font-family: 'Kanit'; font-size: 1rem; }
